<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="1" stop-color="#0d1430"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c3f94"/>
      <stop offset="1" stop-color="#4f8dff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#sky)"/>
  <g fill="#0a0f22">
    <rect x="40" y="150" width="70" height="150"/><rect x="130" y="110" width="55" height="190"/>
    <rect x="200" y="170" width="80" height="130"/><rect x="300" y="90" width="60" height="210"/>
    <rect x="380" y="160" width="50" height="140"/><rect x="820" y="140" width="65" height="160"/>
    <rect x="905" y="100" width="58" height="200"/><rect x="980" y="165" width="75" height="135"/>
    <rect x="1070" y="120" width="60" height="180"/>
  </g>
  <g fill="#101a3d">
    <rect x="120" y="200" width="16" height="7"/><rect x="920" y="210" width="16" height="7"/>
  </g>
  <!-- iPhone -->
  <g>
    <rect x="330" y="95" width="86" height="150" rx="16" fill="none" stroke="#4f8dff" stroke-width="3"/>
    <rect x="362" y="104" width="22" height="4" rx="2" fill="#4f8dff" opacity="0.7"/>
    <rect x="342" y="118" width="62" height="102" rx="4" fill="#0d1430" stroke="#1c3f94" stroke-width="1.5"/>
  </g>
  <!-- wireless arcs -->
  <g fill="none" stroke="#7fb0ff" stroke-width="3" stroke-linecap="round">
    <path d="M 455 150 A 34 34 0 0 1 489 196" opacity="0.9" transform="translate(0,-23)"/>
    <path d="M 455 150 A 58 58 0 0 1 513 220" opacity="0.55" transform="translate(0,-35)"/>
    <path d="M 455 150 A 82 82 0 0 1 537 244" opacity="0.3" transform="translate(0,-47)"/>
  </g>
  <!-- PC window -->
  <g>
    <rect x="700" y="85" width="180" height="130" rx="10" fill="#0d1430" stroke="#4f8dff" stroke-width="3"/>
    <rect x="700" y="85" width="180" height="22" rx="10" fill="none" stroke="#4f8dff" stroke-width="3"/>
    <circle cx="716" cy="96" r="3" fill="#4f8dff"/><circle cx="730" cy="96" r="3" fill="#4f8dff" opacity="0.6"/><circle cx="744" cy="96" r="3" fill="#4f8dff" opacity="0.35"/>
    <rect x="716" y="122" width="148" height="78" rx="4" fill="none" stroke="#1c3f94" stroke-width="2"/>
    <path d="M 780 141 L 780 180 L 812 160 Z" fill="#4f8dff"/>
  </g>
  <text x="600" y="142" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
        font-size="44" font-weight="bold" fill="#e6eeff" letter-spacing="8">AIRGLASS</text>
  <text x="600" y="180" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
        font-size="16" fill="#7fb0ff" letter-spacing="2">iphone mirroring for windows</text>
  <text x="600" y="262" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
        font-size="13" fill="#3d5aa8" letter-spacing="4">airplay, no apple required</text>
</svg>
